<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning - Infirmier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #1abc9c;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-calendar-alt"></i> Planning</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-infirmier.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Planning du personnel</h2>
        <div id="planningList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            try {
                const planning = await API.get('/planning');
                console.log("📦 Planning reçu :", planning);

                // ✅ Fonction de formatage spécifique pour le planning
                function formaterPlanning(p) {
                    return {
                        id: p.id_planning || p.id,
                        personnel: {
                            nom: p.nom || p.personnel_nom || 'Inconnu',
                            prenom: p.prenom || p.personnel_prenom || ''
                        },
                        date: p.date ? new Date(p.date).toLocaleDateString() : 'Date inconnue',
                        heure_debut: p.heure_debut || p.debut || 'N/A',
                        heure_fin: p.heure_fin || p.fin || 'N/A',
                        affectation: p.affectation || p.service || 'Non définie',
                        statut: p.statut || 'Planifié',
                        statutBadge: p.statut === 'termine' ? 'success' : p.statut === 'en_cours' ? 'warning' : 'secondary'
                    };
                }

                // ✅ Affichage avec afficherListe
                afficherListe(
                    'planningList',
                    planning,
                    formaterPlanning,
                    (f) => `
                        <div class="consultation-card mb-3" style="border-left-color: #1abc9c;">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${f.personnel.prenom} ${f.personnel.nom}</strong>
                                    <span class="badge-custom badge-${f.statutBadge} ms-2">${f.statut}</span>
                                </div>
                                <small class="text-muted">${f.date}</small>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-clock me-2"></i>${f.heure_debut} – ${f.heure_fin}</div>
                                <div><i class="fas fa-tasks me-2"></i>Affectation: ${f.affectation}</div>
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='planning-details.html?id=${f.id}'">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-warning me-1" onclick="window.location.href='editer-planning.html?id=${f.id}'">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="supprimerPlanning(${f.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement planning :', e);
                document.getElementById('planningList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement du planning. Veuillez réessayer.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();

        // ============================================
        // FONCTION SUPPRIMER
        // ============================================
        async function supprimerPlanning(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce créneau ?')) return;

            try {
                const result = await API.delete(`/planning/${id}`);
                if (result.success) {
                    alert('Créneau supprimé avec succès');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (e) {
                console.error('❌ Erreur suppression :', e);
                alert('Erreur lors de la suppression');
            }
        }
    </script>
</body>

</html>
