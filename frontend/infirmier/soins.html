<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soins - Infirmier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #1abc9c;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-hand-holding-medical"></i> Soins</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-infirmier.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Soins programmés</h2>
        <div id="soinsList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            try {
                const soins = await API.get('/soins');
                console.log("📦 Soins reçus :", soins);

                // ✅ Fonction de formatage spécifique pour les soins
                function formaterSoin(s) {
                    return {
                        id: s.id_soin || s.id,
                        patient: {
                            nom: s.nom || s.patient_nom || 'Inconnu',
                            prenom: s.prenom || s.patient_prenom || ''
                        },
                        type: s.type_soin || s.type || 'Soin',
                        description: s.description || '',
                        date: s.date_soin ? new Date(s.date_soin).toLocaleString() : 'Date inconnue',
                        statut: s.statut || 'Programmé',
                        statutBadge: s.urgent ? 'danger' : (s.statut === 'termine' ? 'success' : 'info'),
                        urgent: s.urgent || false
                    };
                }

                // ✅ Affichage avec afficherListe
                afficherListe(
                    'soinsList',
                    soins,
                    formaterSoin,
                    (f) => `
                        <div class="consultation-card mb-3" style="border-left-color: ${f.urgent ? '#e74c3c' : '#1abc9c'};">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${f.patient.prenom} ${f.patient.nom}</strong>
                                    <span class="badge-custom badge-${f.statutBadge} ms-2">${f.urgent ? '⚠️ Urgent' : f.statut}</span>
                                </div>
                                <small class="text-muted">${f.date}</small>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-notes-medical me-2"></i>${f.type}</div>
                                ${f.description ? `<div><i class="fas fa-comment me-2"></i>${f.description}</div>` : ''}
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='soin-details.html?id=${f.id}'">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-success me-1" onclick="terminerSoin(${f.id})">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="supprimerSoin(${f.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement soins :', e);
                document.getElementById('soinsList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des soins. Veuillez réessayer.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();

        // ============================================
        // FONCTIONS ACTIONS
        // ============================================
        async function terminerSoin(id) {
            if (!confirm('Confirmer la fin de ce soin ?')) return;

            try {
                const result = await API.patch(`/soins/${id}/statut`, { statut: 'termine' });
                if (result.success) {
                    alert('Soin terminé avec succès');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la mise à jour');
                }
            } catch (e) {
                console.error('❌ Erreur :', e);
                alert('Erreur lors de la mise à jour');
            }
        }

        async function supprimerSoin(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce soin ?')) return;

            try {
                const result = await API.delete(`/soins/${id}`);
                if (result.success) {
                    alert('Soin supprimé avec succès');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (e) {
                console.error('❌ Erreur suppression :', e);
                alert('Erreur lors de la suppression');
            }
        }
    </script>
</body>

</html>
