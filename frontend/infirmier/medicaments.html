<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicaments - Infirmier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #1abc9c;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-pills"></i> Médicaments</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-infirmier.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Distribution des médicaments</h2>
        <div id="medicamentsList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            try {
                const medicaments = await API.get('/medicaments');
                console.log("📦 Médicaments reçus :", medicaments);

                // ✅ Affichage avec afficherListe + formaterMedicament
                afficherListe(
                    'medicamentsList',
                    medicaments,
                    formaterMedicament,
                    (f) => `
                        <div class="consultation-card mb-3" style="border-left-color: #1abc9c;">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${f.nom}</strong>
                                    ${f.estAlerte ? '<span class="badge bg-danger ms-2">⚠️ Stock bas !</span>' : ''}
                                </div>
                                <span class="badge bg-${f.quantite > f.seuil ? 'success' : 'warning'}">
                                    Qté: ${f.quantite}
                                </span>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-weight me-2"></i>Dosage: ${f.dosage}</div>
                                <div><i class="fas fa-exclamation-triangle me-2"></i>Seuil d'alerte: ${f.seuil}</div>
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='medicament-details.html?id=${f.id}'">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-warning me-1" onclick="window.location.href='editer-medicament.html?id=${f.id}'">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="supprimerMedicament(${f.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement médicaments :', e);
                document.getElementById('medicamentsList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des médicaments. Veuillez réessayer.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();

        // ============================================
        // FONCTION SUPPRIMER
        // ============================================
        async function supprimerMedicament(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce médicament ?')) return;

            try {
                const result = await API.delete(`/medicaments/${id}`);
                if (result.success) {
                    alert('Médicament supprimé avec succès');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (e) {
                console.error('❌ Erreur suppression :', e);
                alert('Erreur lors de la suppression');
            }
        }
    </script>
</body>

</html>
