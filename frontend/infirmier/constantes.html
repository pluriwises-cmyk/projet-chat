<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constantes - Infirmier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #1abc9c;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-heartbeat"></i> Constantes</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-infirmier.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Patients sous surveillance</h2>
        <div id="constantesList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            try {
                const constantes = await API.getConstantes();
                console.log("📦 Constantes reçues :", constantes);

                // ✅ Affichage avec afficherListe + formaterConstante
                afficherListe(
                    'constantesList',
                    constantes,
                    formaterConstante,
                    (f) => `
                        <div class="consultation-card mb-3" style="border-left-color: #1abc9c;">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${f.patientPrenom} ${f.patient}</strong>
                                    <span class="badge bg-info ms-2">Ch. ${f.chambre}</span>
                                </div>
                                <small class="text-muted">${f.date}</small>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-heartbeat me-2"></i>TA: ${f.tension}</div>
                                <div><i class="fas fa-heart me-2"></i>Pouls: ${f.pouls}</div>
                                <div><i class="fas fa-thermometer-half me-2"></i>Température: ${f.temperature}°C</div>
                                <div><i class="fas fa-lungs me-2"></i>Saturation: ${f.saturation}%</div>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement constantes :', e);
                document.getElementById('constantesList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des constantes. Veuillez réessayer.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();
    </script>
</body>

</html>
