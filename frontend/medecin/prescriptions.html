<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions - Médecin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #3498db;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-prescription"></i> Prescriptions</span>
            <button class="btn btn-light btn-sm" onclick="window.location.href='../dashboard-medecin.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Liste des prescriptions</h2>
        <div id="prescriptionsList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            // ========== VÉRIFICATION DU TOKEN ==========
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            let medecinId = null;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                medecinId = payload.id;
                
                // Vérification du rôle
                if (payload.role !== 'medecin') {
                    alert('Accès non autorisé');
                    window.location.href = '../index.html';
                    return;
                }
            } catch (e) {
                console.error('Token invalide', e);
                window.location.href = '../index.html';
                return;
            }

            // ========== CHARGEMENT DES DONNÉES ==========
            try {
                const prescriptions = await API.get(`/prescriptions/medecin/${medecinId}`);
                console.log("📦 Prescriptions reçues :", prescriptions);

                // ✅ Affichage avec afficherListe + formaterPrescription
                afficherListe(
                    'prescriptionsList',
                    prescriptions,
                    formaterPrescription,
                    (p) => `
                        <div class="consultation-card mb-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${p.medicament}</strong>
                                    <span class="badge-custom badge-${p.statutBadge} ms-2">${p.statut}</span>
                                </div>
                                <small class="text-muted">${p.date}</small>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-user me-2"></i>Patient : ${p.patient.prenom} ${p.patient.nom}</div>
                                <div><i class="fas fa-info-circle me-2"></i>Posologie : ${p.posologie}</div>
                                <div><i class="fas fa-clock me-2"></i>Durée : ${p.duree}</div>
                                ${p.instructions ? `<div><i class="fas fa-comment me-2"></i>${p.instructions}</div>` : ''}
                                <div><i class="fas fa-user-md me-2"></i>Médecin : ${p.medecin.prenom} ${p.medecin.nom}</div>
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='prescription-details.html?id=${p.id}'">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-warning me-1" onclick="window.location.href='editer-prescription.html?id=${p.id}'">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="supprimerPrescription(${p.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement prescriptions :', e);
                document.getElementById('prescriptionsList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des prescriptions. Veuillez réessayer.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();

        // ============================================
        // FONCTION SUPPRIMER
        // ============================================
        async function supprimerPrescription(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette prescription ?')) return;

            try {
                const result = await API.delete(`/prescriptions/${id}`);
                if (result.success) {
                    alert('Prescription supprimée avec succès');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (e) {
                console.error('❌ Erreur suppression :', e);
                alert('Erreur lors de la suppression');
            }
        }
    </script>
</body>

</html>
