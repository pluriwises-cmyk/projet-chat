<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions - Médecin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #3498db;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-prescription"></i> Prescriptions</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-medecin.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Liste des prescriptions</h2>
        <div id="prescriptionsList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            let medecinId = null;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                medecinId = payload.id;
            } catch (e) {
                console.error('Token invalide', e);
                window.location.href = '../index.html';
                return;
            }

            try {
                // ✅ Récupération des prescriptions du médecin
                const prescriptions = await API.get(`/prescriptions/medecin/${medecinId}`);
                console.log("📦 Prescriptions reçues :", prescriptions);

                // ✅ Affichage avec utils.js (utilisation de formaterMedicament ou formaterConsultation adapté)
                // Pour les prescriptions, on utilise un formatage spécifique
                const container = document.getElementById('prescriptionsList');

                if (prescriptions && prescriptions.length > 0) {
                    container.innerHTML = prescriptions.map(p => {
                        const medecinNom = p.medecin_nom || 'Médecin';
                        const medecinPrenom = p.medecin_prenom || '';
                        return `
                            <div class="consultation-card mb-3">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <strong>${p.medicament || 'Médicament'}</strong>
                                        <span class="badge-custom badge-${p.statut === 'en_cours' ? 'warning' : 'success'} ms-2">${p.statut || 'Active'}</span>
                                    </div>
                                    <small class="text-muted">${new Date(p.date_prescription).toLocaleDateString()}</small>
                                </div>
                                <div class="mt-2">
                                    <div><i class="fas fa-user me-2"></i>Patient : ${p.patient_nom || 'Inconnu'} ${p.patient_prenom || ''}</div>
                                    <div><i class="fas fa-info-circle me-2"></i>Posologie : ${p.posologie || 'N/A'}</div>
                                    <div><i class="fas fa-clock me-2"></i>Durée : ${p.duree || 'N/A'}</div>
                                    ${p.instructions ? `<div><i class="fas fa-comment me-2"></i>${p.instructions}</div>` : ''}
                                    <div><i class="fas fa-user-md me-2"></i>Médecin : ${medecinPrenom} ${medecinNom}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<p class="text-center text-muted">Aucune prescription trouvée</p>';
                }

            } catch (e) {
                console.error('Erreur chargement prescriptions :', e);
                document.getElementById('prescriptionsList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des prescriptions. Veuillez réessayer.
                    </div>
                `;
            }
        })();
    </script>
</body>

</html>
