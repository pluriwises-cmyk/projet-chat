<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultations - Médecin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #3498db;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-stethoscope"></i> Consultations</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-medecin.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Liste des consultations</h2>
        <div id="consultationsList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            let medecinId = null;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                medecinId = payload.id;
            } catch (e) {
                console.error('Token invalide', e);
                window.location.href = '../index.html';
                return;
            }

            try {
                // ✅ Récupération des vraies consultations du médecin
                const consultations = await API.getConsultations(medecinId);
                console.log("📦 Consultations reçues :", consultations);

                // ✅ Affichage avec utils.js
                afficherListe(
                    'consultationsList',
                    consultations,
                    formaterConsultation,
                    (f) => `
                        <div class="consultation-card mb-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${f.patient.prenom} ${f.patient.nom}</strong>
                                    <span class="badge-custom badge-${f.statutBadge} ms-2">${f.statut}</span>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary" onclick="window.location.href='consultation-details.html?id=${f.id}'">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mt-2">
                                <div><i class="far fa-calendar-alt me-2"></i>${f.date}</div>
                                <div><i class="fas fa-comment me-2"></i>${f.motif}</div>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('Erreur chargement consultations :', e);
                document.getElementById('consultationsList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des consultations. Veuillez réessayer.
                    </div>
                `;
            }
        })();
    </script>
</body>

</html>
