<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finances - Direction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #2c3e50;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-chart-line"></i> Finances</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-direction.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Tableau de bord financier</h2>
        
        <!-- Cartes de synthèse -->
        <div class="row mb-4" id="financeStats">
            <div class="col-md-3">
                <div class="stat-card" style="border-left-color: #27ae60;">
                    <div class="stat-value" id="totalPaye">0</div>
                    <div class="stat-label">Payé</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="border-left-color: #e67e22;">
                    <div class="stat-value" id="totalImpaye">0</div>
                    <div class="stat-label">Impayé</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="border-left-color: #3498db;">
                    <div class="stat-value" id="totalToutes">0</div>
                    <div class="stat-label">Total factures</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="border-left-color: #e74c3c;">
                    <div class="stat-value" id="montantTotal">0</div>
                    <div class="stat-label">Montant total</div>
                </div>
            </div>
        </div>

        <div id="facturesList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement des factures...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            try {
                const factures = await API.getFactures();
                console.log("📦 Factures reçues :", factures);

                // ========== STATISTIQUES FINANCIERES ==========
                let totalPaye = 0, totalImpaye = 0, montantTotal = 0;
                
                factures.forEach(f => {
                    const montant = f.montant_ttc || f.montant || 0;
                    montantTotal += montant;
                    if (f.statut === 'payee') {
                        totalPaye++;
                    } else {
                        totalImpaye++;
                    }
                });

                document.getElementById('totalPaye').textContent = totalPaye;
                document.getElementById('totalImpaye').textContent = totalImpaye;
                document.getElementById('totalToutes').textContent = factures.length;
                document.getElementById('montantTotal').textContent = montantTotal.toLocaleString() + ' DA';

                // ========== AFFICHAGE DES FACTURES ==========
                afficherListe(
                    'facturesList',
                    factures,
                    formaterFacture,
                    (f) => `
                        <div class="consultation-card mb-3" style="border-left-color: ${f.statut === 'payee' ? '#27ae60' : '#e74c3c'};">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>Facture #${f.numero}</strong>
                                    <span class="badge-custom badge-${f.statutBadge} ms-2">${f.statut}</span>
                                </div>
                                <small class="text-muted">${f.date}</small>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-user me-2"></i>Patient: ${f.patientPrenom} ${f.patient}</div>
                                <div><i class="fas fa-money-bill me-2"></i>Montant: ${f.montant.toLocaleString()} DA</div>
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='facture-details.html?id=${f.id}'">
                                    <i class="fas fa-eye"></i>
                                </button>
                                ${f.statut !== 'payee' ? `
                                    <button class="btn btn-sm btn-outline-success me-1" onclick="marquerPayee(${f.id})">
                                        <i class="fas fa-check me-1"></i>Marquer payée
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement finances :', e);
                document.getElementById('facturesList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des données financières.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();

        // ============================================
        // FONCTION MARQUER PAYEE
        // ============================================
        async function marquerPayee(id) {
            if (!confirm('Confirmer le paiement de cette facture ?')) return;

            try {
                const result = await API.patch(`/factures/${id}/statut`, { statut: 'payee' });
                if (result.success) {
                    alert('Facture marquée comme payée');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la mise à jour');
                }
            } catch (e) {
                console.error('❌ Erreur :', e);
                alert('Erreur lors de la mise à jour');
            }
        }
    </script>
</body>

</html>
