<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendez-vous - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #8e44ad;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-calendar-check"></i> Rendez-vous</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-admin.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Liste des rendez-vous</h2>
        <div id="rdvList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            try {
                // ✅ Récupération des vrais rendez-vous
                const rdvs = await API.getRendezVous();
                console.log("📦 Rendez-vous reçus :", rdvs);

                // ✅ Affichage avec afficherListe + formaterRendezVous (déjà dans utils.js)
                afficherListe(
                    'rdvList',
                    rdvs,
                    formaterRendezVous,
                    (f) => `
                        <div class="consultation-card mb-3" style="border-left-color: #8e44ad;">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${f.patient.prenom} ${f.patient.nom}</strong>
                                    <span class="badge-custom badge-${f.statutBadge} ms-2">${f.statut}</span>
                                </div>
                                <small class="text-muted">${f.date}</small>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-user-md me-2"></i>Médecin: ${f.medecin.prenom} ${f.medecin.nom}</div>
                                <div><i class="fas fa-comment me-2"></i>Motif: ${f.motif}</div>
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='rendezvous-details.html?id=${f.id}'">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-warning me-1" onclick="window.location.href='editer-rendezvous.html?id=${f.id}'">
                                    <i class="fas fa-edit"></i>
                                </button>
                                ${f.statut !== 'annule' ? `
                                    <button class="btn btn-sm btn-outline-success me-1" onclick="confirmerRendezVous(${f.id})">
                                        <i class="fas fa-check"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger me-1" onclick="annulerRendezVous(${f.id})">
                                        <i class="fas fa-times"></i>
                                    </button>
                                ` : ''}
                                <button class="btn btn-sm btn-outline-danger" onclick="supprimerRendezVous(${f.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement rendez-vous :', e);
                document.getElementById('rdvList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des rendez-vous. Veuillez réessayer.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();

        // ============================================
        // FONCTIONS ACTIONS
        // ============================================
        async function confirmerRendezVous(id) {
            if (!confirm('Confirmer ce rendez-vous ?')) return;

            try {
                const result = await API.patch(`/rendez-vous/${id}/statut`, { statut: 'confirme' });
                if (result.success) {
                    alert('Rendez-vous confirmé');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la mise à jour');
                }
            } catch (e) {
                console.error('❌ Erreur :', e);
                alert('Erreur lors de la mise à jour');
            }
        }

        async function annulerRendezVous(id) {
            if (!confirm('Annuler ce rendez-vous ?')) return;

            try {
                const result = await API.patch(`/rendez-vous/${id}/statut`, { statut: 'annule' });
                if (result.success) {
                    alert('Rendez-vous annulé');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la mise à jour');
                }
            } catch (e) {
                console.error('❌ Erreur :', e);
                alert('Erreur lors de la mise à jour');
            }
        }

        async function supprimerRendezVous(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce rendez-vous ?')) return;

            try {
                const result = await API.delete(`/rendez-vous/${id}`);
                if (result.success) {
                    alert('Rendez-vous supprimé');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (e) {
                console.error('❌ Erreur suppression :', e);
                alert('Erreur lors de la suppression');
            }
        }
    </script>
</body>

</html>
