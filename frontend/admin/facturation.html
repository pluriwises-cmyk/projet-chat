<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturation - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
</head>

<body>
    <nav class="navbar-custom" style="background: #8e44ad;">
        <div class="container-fluid px-4">
            <span class="navbar-brand"><i class="fas fa-file-invoice"></i> Facturation</span>
            <button class="btn btn-light btn-sm"
                onclick="window.location.href='../dashboard-admin.html'">Retour</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h2>Factures en attente</h2>
        <div id="facturesList" class="loading-container mt-4">
            <div class="loading-spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '../index.html';
                return;
            }

            try {
                // ✅ Récupération des vraies factures depuis l'API
                const factures = await API.getFactures();
                console.log("📦 Factures reçues :", factures);

                // ✅ Affichage avec afficherListe + formaterFacture (déjà dans utils.js)
                afficherListe(
                    'facturesList',
                    factures,
                    formaterFacture,
                    (f) => `
                        <div class="consultation-card mb-3" style="border-left-color: ${f.statut === 'payee' ? '#27ae60' : '#e74c3c'};">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>Facture #${f.numero}</strong>
                                    <span class="badge-custom badge-${f.statutBadge} ms-2">${f.statut}</span>
                                </div>
                                <small class="text-muted">${f.date}</small>
                            </div>
                            <div class="mt-2">
                                <div><i class="fas fa-user me-2"></i>Patient: ${f.patientPrenom} ${f.patient}</div>
                                <div><i class="fas fa-money-bill me-2"></i>Montant: ${f.montant.toLocaleString()} FCFA</div>
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="window.location.href='facture-details.html?id=${f.id}'">
                                    <i class="fas fa-eye"></i>
                                </button>
                                ${f.statut !== 'payee' ? `
                                    <button class="btn btn-sm btn-outline-success me-1" onclick="marquerPayee(${f.id})">
                                        <i class="fas fa-check me-1"></i>Marquer payée
                                    </button>
                                ` : ''}
                                <button class="btn btn-sm btn-outline-danger" onclick="supprimerFacture(${f.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `
                );

            } catch (e) {
                console.error('❌ Erreur chargement factures :', e);
                document.getElementById('facturesList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Erreur lors du chargement des factures. Veuillez réessayer.
                        <br><small class="text-muted">${e.message || ''}</small>
                    </div>
                `;
            }
        })();

        // ============================================
        // FONCTIONS ACTIONS
        // ============================================
        async function marquerPayee(id) {
            if (!confirm('Confirmer le paiement de cette facture ?')) return;

            try {
                const result = await API.patch(`/factures/${id}/statut`, { statut: 'payee' });
                if (result.success) {
                    alert('Facture marquée comme payée');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la mise à jour');
                }
            } catch (e) {
                console.error('❌ Erreur :', e);
                alert('Erreur lors de la mise à jour');
            }
        }

        async function supprimerFacture(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette facture ?')) return;

            try {
                const result = await API.delete(`/factures/${id}`);
                if (result.success) {
                    alert('Facture supprimée avec succès');
                    window.location.reload();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (e) {
                console.error('❌ Erreur suppression :', e);
                alert('Erreur lors de la suppression');
            }
        }
    </script>
</body>

</html>
